name: Publish to npm

on:
  release:
    types:
      - published

# npm Trusted Publishing exchanges GitHub's short-lived OIDC token for
# publish authorization. No NPM_TOKEN secret is required.
permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish ${{ github.event.release.tag_name }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Verify release tag matches package version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: >-
          node -e "const pkg=require('./package.json');
          const expected='v'+pkg.version;
          const actual=process.env.RELEASE_TAG;
          if(actual!==expected){
            console.error('Release tag '+actual+' does not match package version '+pkg.version+' (expected '+expected+').');
            process.exit(1);
          }"

      - name: Verify repository metadata
        env:
          GITHUB_REPOSITORY_NAME: ${{ github.repository }}
        run: >-
          node -e "const pkg=require('./package.json');
          const raw=typeof pkg.repository==='string' ? pkg.repository : pkg.repository?.url;
          const normalize=(value='')=>value
            .replace(/^git\+/, '')
            .replace(/^git:\/\/github\.com\//, 'https://github.com/')
            .replace(/\.git$/, '')
            .replace(/\/$/, '');
          const actual=normalize(raw);
          const expected='https://github.com/'+process.env.GITHUB_REPOSITORY_NAME;
          if(actual!==expected){
            console.error('package.json repository must point to '+expected+' for npm Trusted Publishing. Current value: '+(raw || '<missing>'));
            process.exit(1);
          }"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build --if-present

      - name: Test
        run: npm test

      - name: Verify package contents
        run: npm pack --dry-run

      - name: Publish to npm
        run: npm publish --access public
